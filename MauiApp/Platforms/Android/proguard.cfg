# ProGuard/R8 rules for .NET MAUI Android
# These rules preserve classes and members that MAUI needs for reflection-based features
# such as handler registrations, bindable properties, and VisualElement initialization.

# Preserve all Microsoft.Maui classes
-keep class microsoft.maui.** { *; }
-keep class com.microsoft.maui.** { *; }
-dontwarn microsoft.maui.**
-dontwarn com.microsoft.maui.**

# Preserve MAUI Controls and Handlers
-keep class Microsoft.Maui.Controls.** { *; }
-keep class Microsoft.Maui.Handlers.** { *; }
-keep class Microsoft.Maui.Platform.** { *; }

# Preserve VisualElement and related classes (critical for app startup)
-keep class Microsoft.Maui.Controls.VisualElement { *; }
-keep class Microsoft.Maui.Controls.VisualElement$* { *; }
-keepclassmembers class Microsoft.Maui.Controls.VisualElement {
    *;
}

# Preserve bindable properties and property changed handlers
-keepclassmembers class * extends Microsoft.Maui.Controls.BindableObject {
    *;
}

# Preserve handler mappings
-keep class * implements Microsoft.Maui.Handlers.IViewHandler { *; }
-keep class * implements Microsoft.Maui.Handlers.IElementHandler { *; }

# Preserve CommunityToolkit classes if used
-keep class CommunityToolkit.Maui.** { *; }
-dontwarn CommunityToolkit.Maui.**

# Preserve SkiaSharp classes if used
-keep class SkiaSharp.** { *; }
-dontwarn SkiaSharp.**

# Preserve AndroidX classes
-keep class androidx.** { *; }
-dontwarn androidx.**

# Preserve application entry points
-keep class * extends android.app.Application { *; }
-keep class * extends android.app.Activity { *; }
-keep class * extends androidx.appcompat.app.AppCompatActivity { *; }

# Preserve native methods
-keepclasseswithmembernames class * {
    native <methods>;
}

# Preserve enums
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# Keep custom application classes
-keep class crc6488302ad6e9e4df1a.** { *; }

# Preserve constructors for classes that are instantiated via reflection
-keepclassmembers class * {
    public <init>(...);
}

# Preserve serialization classes
-keepclassmembers class * implements java.io.Serializable {
    static final long serialVersionUID;
    private static final java.io.ObjectStreamField[] serialPersistentFields;
    private void writeObject(java.io.ObjectOutputStream);
    private void readObject(java.io.ObjectInputStream);
    java.lang.Object writeReplace();
    java.lang.Object readResolve();
}

